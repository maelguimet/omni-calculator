[package]
name = "omni-calc"
version = "0.1.0"
edition = "2024"
description = "A local model-powered scientific calculator for humans and agents"
license = "MIT"
repository = "https://github.com/maelguimet/omni-calculator"
homepage = "https://github.com/maelguimet/omni-calculator"
readme = "README.md"

[features]
default = ["bundled-needle", "fast-router", "tuned-model"]
bundled-needle = []
fast-router = []
tuned-model = ["bundled-needle"]

[lib]
name = "omni_calc"
path = "src/lib.rs"

[[bin]]
name = "calc"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
libloading = "0.8"
sha2 = "0.10"
fend-core = "=1.5.8"
statrs = { version = "0.18", default-features = false }
nalgebra = "0.34"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
fend-core = { path = "vendor/fend-core" }

[profile.release]
lto = "thin"
strip = true
